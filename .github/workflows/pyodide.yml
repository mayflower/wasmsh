name: Pyodide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pyodide.yml'
      - 'crates/**'
      - 'tools/pyodide/**'
      - 'e2e/pyodide-node/**'
      - 'e2e/pyodide-browser/**'
      - 'e2e/build-contract/**'
      # A toolchain or lockfile change relinks the main module against the
      # cached side modules, which is exactly the pairing this job exists to
      # validate.
      - 'rust-toolchain.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/pyodide.yml'
      - 'crates/**'
      - 'tools/pyodide/**'
      - 'e2e/pyodide-node/**'
      - 'e2e/pyodide-browser/**'
      - 'e2e/build-contract/**'
      - 'rust-toolchain.toml'
      - 'Cargo.lock'

concurrency:
  group: pyodide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Pyodide build + E2E
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: mayflower-k8s-runners
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # ── Tier-2 cache: Pyodide source + emsdk ────────────────────
      # The Pyodide build is the dominant cost in CI (~30 min).  Most
      # of that time is the emsdk install (~5 min) and the CPython +
      # libffi + pyodide-build builds.  Both are version-locked: they
      # only need to rebuild when `tools/pyodide/versions.env` changes
      # (the single source of truth for PYODIDE_VERSION + EMSCRIPTEN
      # _VERSION).  Cache the whole `pyodide-src/` tree keyed on its
      # hash so subsequent CI runs skip straight to the wasmsh staticlib
      # build + final emcc relink.
      #
      # Safety: even if a cached pyodide.asm.wasm contains stale code,
      # build-custom.sh deletes it when the freshly-built wasmsh
      # staticlib is newer (see "Runtime lib is newer than" guard
      # added in 0e447bb).  Per-patch idempotency from b1ad993 means
      # cached patched files don't double-apply on re-run.
      #
      # No `restore-keys` fallback: a versions.env bump must rebuild
      # from scratch, not silently reuse an old emsdk install.
      #
      # CACHE_EPOCH exists because `versions.env` is not a complete
      # description of what this tree contains. `pyodide-src/` also holds
      # the *built package wheels* — including Rust-built side modules like
      # `rpds_py` and `pydantic_core` — which are resolved during the build
      # rather than pinned by `versions.env`. A cache entry can therefore
      # stay valid by key while its side modules drift out of ABI agreement
      # with a freshly relinked main module, which is how `jsonschema` and
      # `pydantic` started trapping with a wasm `unreachable` while every
      # C/Fortran package kept working. The existing staleness guard in
      # build-custom.sh only refreshes `pyodide.asm.wasm`; it does not touch
      # the wheels. Bump this integer to force a clean rebuild.
      - name: Cache Pyodide source + emsdk
        uses: actions/cache@v4
        with:
          path: tools/pyodide/pyodide-src
          key: pyodide-toolchain-v2-${{ runner.os }}-${{ hashFiles('tools/pyodide/versions.env', 'rust-toolchain.toml') }}

      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-emscripten

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: pyodide

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y build-essential wget ccache pkg-config xz-utils autoconf automake libtool

      - name: Build custom Pyodide (links wasmsh runtime staticlib)
        run: just build-pyodide
        env:
          SED: sed
          # Pyodide's libffi build calls autoreconf which needs libtool m4 macros.
          # Pre-copy the system libtool.m4 into the libffi checkout during build.
          PYODIDE_JOBS: "3"

      # Build-contract canary: proves that a standalone wasmsh staticlib
      # (`wasmsh-pyodide-probe`) compiles cleanly for
      # `wasm32-unknown-emscripten` in isolation, without depending on the
      # full Pyodide build pipeline. Catches regressions in emscripten
      # toolchain / target bring-up before they hide behind the much
      # slower Pyodide build.
      - name: Run emscripten build-contract test
        run: just test-emscripten-probe

      - name: Report the built runtime's platform tags
        # What micropip matches lockfile wheel tags against. Printed before
        # the E2E suites so a tag mismatch is visible even when they fail.
        run: |
          node --input-type=module - <<'JS'
          import { createNodeSession } from "./packages/npm/wasmsh-pyodide/index.js";
          const s = await createNodeSession({});
          const r = await s.run(`python3 -c "import sys, sysconfig; print('python', sys.version.split()[0], 'platform', sysconfig.get_platform()); print('emscripten', sys._emscripten_info); from packaging import tags; print('tags', [str(t) for t in list(tags.sys_tags())[:6]])"`);
          console.log(r.output);
          await s.close();
          JS

      - name: Run Pyodide Node E2E
        env:
          # Surface micropip's resolution log and loader errors in the job
          # log; without it a package that fails to load is only visible as
          # the install verification's terse error.
          WASMSH_PIP_DEBUG: "1"
        run: just test-e2e-pyodide-node

      - name: Install Playwright browsers
        working-directory: e2e/pyodide-browser
        run: npm install && npx playwright install chromium --with-deps

      - name: Run Pyodide browser E2E
        run: just test-e2e-pyodide-browser

      - name: Upload Pyodide artifact
        # Uploaded even after a failed E2E so the build can be inspected
        # offline; consumers (stage-pyodide-assets) only take it from a
        # run whose conclusion is success.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasmsh-pyodide
          path: dist/pyodide-custom/
