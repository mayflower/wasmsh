name: Publish LangChain Adapters

# Tag-triggered publish for the langchain-wasmsh adapter packages.
#
# Tag formats:
#   langchain-wasmsh-py-v<version>      → PyPI       (langchain-wasmsh)
#   langchain-wasmsh-npm-v<version>     → npm        (@mayflowergmbh/langchain-wasmsh)
#
# Both jobs also run on workflow_dispatch so a human can trigger them
# manually from the Actions UI when a release is cut without a tag.

on:
  push:
    tags:
      - 'langchain-wasmsh-py-v*'
      - 'langchain-wasmsh-npm-v*'
  workflow_dispatch:
    inputs:
      target:
        description: "Which package to publish"
        required: true
        type: choice
        options:
          - python
          - npm
          - both

concurrency:
  group: langchain-adapters-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # trusted publishing to PyPI via OIDC
  id-token: write

jobs:
  # ── PyPI ───────────────────────────────────────────────────
  publish-python:
    name: Publish to PyPI
    if: |
      startsWith(github.ref, 'refs/tags/langchain-wasmsh-py-v') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'python' || github.event.inputs.target == 'both'))
    runs-on: mayflower-k8s-runners
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-wasmsh
    defaults:
      run:
        working-directory: packages/python/langchain-wasmsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.7"

      - name: Install Node.js (needed by the subprocess smoke test)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync dependencies
        run: uv sync --group test

      - name: Lint (ruff check)
        run: uv run --group test ruff check langchain_wasmsh tests

      - name: Unit tests (mocked)
        run: uv run --group test pytest tests/unit_tests/test_sandbox_mocked.py tests/test_import.py -v

      - name: Build sdist + wheel
        run: uv build

      - name: Verify the built wheel installs and runs
        # Publishing an artifact nobody installed is how a packaging
        # mistake reaches users first: an editable checkout resolves a
        # different graph than a built wheel, so a missing runtime
        # dependency or a file left out of the wheel is invisible until
        # someone `pip install`s it. Drive a real sandbox, not just an
        # import — the assets come from a separate distribution, and a
        # broken pin there only shows up when the sandbox boots.
        run: |
          set -euo pipefail
          uv venv /tmp/verify-wheel
          uv pip install --python /tmp/verify-wheel/bin/python dist/*.whl
          /tmp/verify-wheel/bin/python - <<'PY'
          from langchain_wasmsh import (
              WasmshFilesystemBackend,
              WasmshInterpreterMiddleware,
              WasmshRemoteSandbox,
              WasmshSandbox,
          )

          sandbox = WasmshSandbox()
          try:
              result = sandbox.execute("echo release-check; exit 3")
              assert result.exit_code == 3, result
              assert "release-check" in result.output, result
              assert sandbox.write("/workspace/v.txt", "ok").error is None
              read = sandbox.read("/workspace/v.txt")
              assert read.error is None, read
              assert read.file_data["content"].strip() == "ok", read
          finally:
              sandbox.close()
          print("wheel verified")
          PY

      - name: Verify the built sdist installs
        run: |
          set -euo pipefail
          uv venv /tmp/verify-sdist
          uv pip install --python /tmp/verify-sdist/bin/python dist/*.tar.gz
          /tmp/verify-sdist/bin/python -c "import langchain_wasmsh; print('sdist verified')"

      - name: Publish to PyPI
        # Trusted publishing via OIDC; no token needed on the runner.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/langchain-wasmsh/dist

  # ── npm ────────────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    if: |
      startsWith(github.ref, 'refs/tags/langchain-wasmsh-npm-v') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'npm' || github.event.inputs.target == 'both'))
    runs-on: mayflower-k8s-runners
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/@mayflowergmbh/langchain-wasmsh
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.20.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @mayflowergmbh/langchain-wasmsh typecheck

      - name: Build
        run: pnpm --filter @mayflowergmbh/langchain-wasmsh build

      - name: Unit tests
        run: pnpm --filter @mayflowergmbh/langchain-wasmsh test:unit

      - name: Verify the packed tarball
        # Two packaging mistakes this catches, both of which produce a
        # tarball that looks fine and fails on the user's machine:
        #
        #   1. `workspace:*` left verbatim. This package depends on
        #      `@mayflowergmbh/wasmsh-pyodide` through the workspace
        #      protocol, and only pnpm rewrites it to a real version.
        #      An npm-packed tarball installs with EUNSUPPORTEDPROTOCOL.
        #   2. A tarball with no `dist/`. `npm pack` does not run
        #      `prepublishOnly`, so packing without an explicit build
        #      ships LICENSE, README and package.json and nothing else.
        #
        # A full runtime boot is not attempted here: it would need
        # `@mayflowergmbh/wasmsh-pyodide` at the version being released,
        # which is not on the registry yet during a coordinated release.
        # `langchain-adapters.yml` covers the runtime path against the
        # published assets.
        run: |
          set -euo pipefail
          pnpm --filter @mayflowergmbh/langchain-wasmsh pack \
            --pack-destination "$RUNNER_TEMP"
          tarball="$(find "$RUNNER_TEMP" -name 'mayflowergmbh-langchain-wasmsh-*.tgz' | head -1)"
          echo "Packed: $tarball"
          tar xzOf "$tarball" package/package.json > "$RUNNER_TEMP/manifest.json"
          node - "$RUNNER_TEMP/manifest.json" <<'JS'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          for (const [field, deps] of Object.entries({
            dependencies: manifest.dependencies ?? {},
            peerDependencies: manifest.peerDependencies ?? {},
          })) {
            for (const [name, range] of Object.entries(deps)) {
              if (String(range).startsWith("workspace:")) {
                throw new Error(
                  `${field}.${name} still uses the workspace protocol ` +
                  `(${range}); pack with pnpm, not npm`,
                );
              }
            }
          }
          console.log("manifest ok:", manifest.name + "@" + manifest.version);
          JS
          for entry in package/dist/index.js package/dist/index.cjs package/dist/index.d.ts; do
            tar tzf "$tarball" | grep -qx "$entry" \
              || { echo "missing from tarball: $entry" >&2; exit 1; }
          done
          echo "tarball contents ok"

      - name: Publish to npm
        # `pnpm publish` refuses workspace:* protocol by default; use
        # --no-git-checks because the workflow doesn't run on main HEAD
        # (tag ref).  The `publishConfig.access` in package.json sets
        # `public`.
        run: pnpm --filter @mayflowergmbh/langchain-wasmsh publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
