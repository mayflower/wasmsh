name: LangChain Adapters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/langchain-adapters.yml'
      - 'packages/npm/langchain-wasmsh/**'
      - 'packages/python/langchain-wasmsh/**'
      - 'examples/deepagent-python/**'
      - 'examples/deepagent-typescript/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
  pull_request:
    paths:
      - '.github/workflows/langchain-adapters.yml'
      - 'packages/npm/langchain-wasmsh/**'
      - 'packages/python/langchain-wasmsh/**'
      - 'examples/deepagent-python/**'
      - 'examples/deepagent-typescript/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'

concurrency:
  group: langchain-adapters-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Python: unit + integration (no LLM) + basic example ────
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.resolution }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: mayflower-k8s-runners
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        # `highest` is the newest resolution allowed by the declared window
        # (`deepagents>=0.7.4,<0.8.0`). `lowest-direct` pins every declared
        # floor, which is the only way a too-low bound gets caught — a floor
        # nothing ever installs is a promise, not a constraint.
        resolution: ["highest"]
        include:
          - python-version: "3.12"
            resolution: "lowest-direct"
    defaults:
      run:
        working-directory: packages/python/langchain-wasmsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.7"

      - name: Install Node.js (runtime for WasmshSandbox subprocess)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Deno (second host runtime for the standard suite)
        # The langchain-tests conformance suite runs once per host runtime.
        # Deno restricts the subprocess with --allow-read/--allow-net, so a
        # permission-related divergence from Node cannot hide behind a single
        # green leg.
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Sync dependencies
        run: uv sync --group test --resolution ${{ matrix.resolution }}

      - name: Pin the exact 0.7.4 floor
        if: matrix.resolution == 'lowest-direct'
        # `lowest-direct` already resolves deepagents to its floor; installing
        # the group makes the intent explicit and fails loudly if the floor
        # ever stops being installable.
        run: uv sync --group test --group min-deepagents --resolution lowest-direct

      - name: Show the resolved Deep Agents stack
        run: |
          uv run --group test python - <<'PY'
          import importlib.metadata as md
          for name in ("deepagents", "langchain", "langchain-core", "langgraph", "langchain-tests", "wasmsh-pyodide-runtime"):
              print(f"{name}=={md.version(name)}")
          PY

      - name: Lint (ruff check)
        run: uv run --group test ruff check langchain_wasmsh tests

      - name: Format check (ruff format)
        run: uv run --group test ruff format --check langchain_wasmsh tests

      - name: Unit tests (mocked, no subprocess)
        run: uv run --group test pytest tests/unit_tests/test_sandbox_mocked.py tests/test_import.py -v --disable-socket --allow-unix-socket

      - name: Subprocess tests (real Node runtime)
        run: uv run --group test pytest tests/unit_tests/test_sandbox.py -v

      - name: Integration tests (no LLM)
        # Everything under integration_tests/ except test_agent_sandbox.py,
        # which needs an ANTHROPIC_API_KEY and runs in `*-llm.yml`. That
        # includes the langchain-tests standard suite (run once per host
        # runtime), the create_deep_agent composition matrix, memory/store
        # scopes, permissions, subagents, skills, PTC, the execute-timeout
        # behaviour, and the full-composition golden test.
        run: uv run --group test pytest tests/integration_tests --ignore=tests/integration_tests/test_agent_sandbox.py -v --timeout 300

      - name: Basic example smoke
        # Runs the non-LLM example from examples/deepagent-python/ via the
        # adapter's own venv, bypassing the requirements.txt which points
        # at PyPI (the package isn't published yet).
        run: uv run --group test python ../../../examples/deepagent-python/basic.py

      - name: Build wheel and sdist
        run: uv build

      - name: Wheel install smoke test
        # A built wheel must resolve the same package graph an editable
        # checkout does; a missing runtime dependency only shows up here.
        run: |
          set -euo pipefail
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          /tmp/wheel-check/bin/python -c "
          from langchain_wasmsh import (
              WasmshFilesystemBackend,
              WasmshInterpreterMiddleware,
              WasmshRemoteSandbox,
              WasmshSandbox,
          )
          import deepagents
          print('wheel ok, deepagents', deepagents.__version__)
          "

      - name: Sdist install smoke test
        run: |
          set -euo pipefail
          uv venv /tmp/sdist-check
          uv pip install --python /tmp/sdist-check/bin/python dist/*.tar.gz
          /tmp/sdist-check/bin/python -c "import langchain_wasmsh; print('sdist ok')"

  # ── Optional: Deep Agents Code sandbox provider ────────────
  # Its own job because `deepagents-code` is a separate distribution with its
  # own release cadence and its own Deep Agents pin. A break there is worth
  # knowing about, but it must not gate the adapter's release — so this job
  # is allowed to fail without failing the workflow.
  dcode-provider:
    name: Deep Agents Code provider (optional)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: mayflower-k8s-runners
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/python/langchain-wasmsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.7"

      - name: Install Node.js (runtime for WasmshSandbox subprocess)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync dependencies with the optional provider extra
        run: uv sync --group test --extra deepagents-code

      - name: Show the resolved stack
        run: |
          uv run --group test python - <<'PY'
          import importlib.metadata as md
          for name in ("deepagents", "deepagents-code", "langchain-wasmsh"):
              print(f"{name}=={md.version(name)}")
          PY

      - name: Provider discovery and behaviour
        run: uv run --group test pytest tests/unit_tests/test_dcode_provider.py -v --timeout 120

  # ── npm: unit + build + typecheck ──────────────────────────
  npm:
    name: npm unit (Node ${{ matrix.node-version }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: mayflower-k8s-runners
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.20.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @mayflowergmbh/langchain-wasmsh typecheck

      - name: Build
        run: pnpm --filter @mayflowergmbh/langchain-wasmsh build

      - name: Unit tests
        run: pnpm --filter @mayflowergmbh/langchain-wasmsh test:unit

      - name: Pack check (workspace protocol + build output)
        # Runs here as well as in the publish workflow so a packaging
        # regression is caught on the PR that causes it, rather than on
        # the release tag when it is far more expensive to fix.
        run: |
          set -euo pipefail
          pnpm --filter @mayflowergmbh/langchain-wasmsh pack \
            --pack-destination "$RUNNER_TEMP"
          tarball="$(find "$RUNNER_TEMP" -name 'mayflowergmbh-langchain-wasmsh-*.tgz' | head -1)"
          tar xzOf "$tarball" package/package.json > "$RUNNER_TEMP/manifest.json"
          node - "$RUNNER_TEMP/manifest.json" <<'JS'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          for (const [field, deps] of Object.entries({
            dependencies: manifest.dependencies ?? {},
            peerDependencies: manifest.peerDependencies ?? {},
          })) {
            for (const [name, range] of Object.entries(deps)) {
              if (String(range).startsWith("workspace:")) {
                throw new Error(
                  `${field}.${name} still uses the workspace protocol ` +
                  `(${range}); pack with pnpm, not npm`,
                );
              }
            }
          }
          console.log("manifest ok:", manifest.name + "@" + manifest.version);
          JS
          # List once into a file rather than piping `tar` into `grep -q`
          # per entry: `grep -q` exits on first match, closing the pipe, and
          # under `set -o pipefail` the resulting SIGPIPE on `tar` fails the
          # step. That race is timing-dependent — it passed locally and
          # failed on CI.
          tar tzf "$tarball" > "$RUNNER_TEMP/tarball-listing.txt"
          for entry in package/dist/index.js package/dist/index.cjs package/dist/index.d.ts; do
            grep -qxF "$entry" "$RUNNER_TEMP/tarball-listing.txt" \
              || { echo "missing from tarball: $entry" >&2; exit 1; }
          done
          echo "tarball contents ok"

  # ── npm: integration (no LLM) + basic example ──────────────
  # Requires Pyodide assets in packages/npm/wasmsh-pyodide/assets/.
  # These are gitignored (built by tools/pyodide/build-custom.sh, ~30min).
  # In CI we download the published npm tarball and stage its assets dir
  # into the workspace source tree — the workspace-protocol dep then
  # resolves exactly the bits end users install from the registry.
  npm-integration:
    name: npm integration
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: mayflower-k8s-runners
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.20.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Stage Pyodide assets from published npm tarball
        run: |
          set -euo pipefail
          # Source of truth: the version in packages/npm/wasmsh-pyodide/package.json
          # (what `pnpm install` will publish later when v* is tagged). When that
          # version isn't yet on the npm registry — typical during the
          # bump-on-main → tag → publish window — fall back to the latest
          # released version so the integration tests still run against a real
          # tarball. The released version's adapter ABI is stable enough that
          # the langchain-wasmsh adapter (the actual subject under test) still
          # exercises end-to-end behavior; the gap only matters for changes
          # that touched wasmsh-pyodide internals, which the Pyodide workflow
          # already gates.
          VERSION="$(node -p "require('./packages/npm/wasmsh-pyodide/package.json').version")"
          echo "Target @mayflowergmbh/wasmsh-pyodide@$VERSION"
          tmp="$(mktemp -d)"
          url="https://registry.npmjs.org/@mayflowergmbh/wasmsh-pyodide/-/wasmsh-pyodide-${VERSION}.tgz"
          echo "Fetching $url"
          if ! curl -fsSL "$url" -o "$tmp/pkg.tgz"; then
            echo "Version $VERSION not yet on registry; falling back to latest published"
            LATEST="$(npm view @mayflowergmbh/wasmsh-pyodide version)"
            echo "Falling back to @mayflowergmbh/wasmsh-pyodide@$LATEST"
            url="https://registry.npmjs.org/@mayflowergmbh/wasmsh-pyodide/-/wasmsh-pyodide-${LATEST}.tgz"
            curl -fsSL "$url" -o "$tmp/pkg.tgz"
          fi
          mkdir -p "$tmp/extract"
          tar -xzf "$tmp/pkg.tgz" -C "$tmp/extract"
          cp -r "$tmp/extract/package/assets/"* packages/npm/wasmsh-pyodide/assets/
          ls packages/npm/wasmsh-pyodide/assets/pyodide.asm.wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build langchain-wasmsh adapter
        # The deepagent-typescript example imports
        # @mayflowergmbh/langchain-wasmsh via `workspace:*`, which pnpm
        # resolves to packages/npm/langchain-wasmsh — and tsx then needs
        # the compiled `dist/index.js`. Build it before the smoke test
        # so the example resolution doesn't fail with ERR_MODULE_NOT_FOUND.
        run: pnpm --filter @mayflowergmbh/langchain-wasmsh build

      - name: Integration tests (sandbox standard suite, no LLM)
        run: pnpm --filter @mayflowergmbh/langchain-wasmsh test:int

      - name: Basic example smoke
        run: pnpm --filter wasmsh-deepagent-typescript-example run basic
