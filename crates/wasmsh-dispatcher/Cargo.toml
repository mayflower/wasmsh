[package]
name = "wasmsh-dispatcher"
description = "Capacity-based dispatcher for the scalable wasmsh snapshot runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
# `rustls-no-provider` keeps reqwest off the aws-lc-rs default so the TLS
# stack stays on `ring` (see the `rustls` line below), which is what the
# license allowlist in deny.toml covers.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# Selects the crypto provider for the rustls stack reqwest links against;
# `Service::new` installs it as the process default before building the
# client, which `rustls-no-provider` requires.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = "2"
thiserror = { workspace = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
