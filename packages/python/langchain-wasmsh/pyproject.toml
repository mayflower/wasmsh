[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-wasmsh"
description = "wasmsh sandbox backend for LangChain Deep Agents"
license = { text = "MIT" }
readme = "README.md"

classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

version = "0.8.0"
requires-python = ">=3.11,<4.0"
dependencies = [
    "httpx>=0.27,<1.0.0",
    # 0.7.0 is the first host that advertises the `host_call` capability,
    # which the interpreter's programmatic tool calling requires.
    "wasmsh-pyodide-runtime>=0.7.0",
    "deepagents>=0.7.4,<0.8.0",
    "langchain>=1.3.14,<2.0.0",
    "langchain-core>=1.5.0,<2.0.0",
    "langgraph>=1.2.5,<1.3.0",
    "pydantic>=2.7.4,<3.0.0",
]

[project.optional-dependencies]
# The CLI integration only. Deliberately not a base dependency: it is a
# separate distribution with its own release cadence and its own Deep Agents
# pin, and `langchain_wasmsh` must not pull the CLI stack into an ordinary
# agent process.
deepagents-code = ["deepagents-code>=0.1.56"]

[project.entry-points."deepagents_code.sandbox_providers"]
# Discovered by the Deep Agents Code CLI. Declaring the entry points is safe
# even without the optional extra installed: the CLI is the only thing that
# reads this group, and `langchain_wasmsh.dcode_provider` raises a clear
# ImportError rather than importing anything from an absent package.
wasmsh = "langchain_wasmsh.dcode_provider:WasmshSandboxProvider"
wasmsh-remote = "langchain_wasmsh.dcode_provider:WasmshRemoteSandboxProvider"

[project.urls]
Homepage = "https://github.com/mayflower/wasmsh/tree/main/packages/python/langchain-wasmsh"
Repository = "https://github.com/mayflower/wasmsh"
Documentation = "https://github.com/mayflower/wasmsh/blob/main/docs/integrations/langchain-wasmsh.md"
Issues = "https://github.com/mayflower/wasmsh/issues"

[tool.hatch.build.targets.wheel]
packages = ["langchain_wasmsh"]

[dependency-groups]
dev = []
test = [
    "pytest>=7.3.0,<10.0.0",
    # Lower bounds matter here, not just upper ones: the `lowest-direct`
    # CI leg installs every declared floor, and an unpinned test tool
    # resolves to a decade-old release that cannot run the suite.
    "pytest-cov>=5.0",
    "pytest-socket>=0.7",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3.1,<3.0.0",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22",
    "ruff>=0.13.1,<0.16.0",
    # Pinned exactly: the sandbox conformance suite makes byte-level
    # assertions, so a floating version would silently change what
    # "0.7.4 compatible" means. Bump deliberately alongside `deepagents`.
    "langchain-tests==1.1.9",
    "langchain-anthropic>=1.0.0",
]
# Lower-bound leg for the exact 0.7.4 compatibility job. Install with
# `uv sync --group test --group min-deepagents --resolution lowest-direct`
# to prove the declared floors actually resolve and pass.
min-deepagents = [
    "deepagents==0.7.4",
]

[tool.uv]
constraint-dependencies = ["urllib3>=2.6.3"]
# `deepagents-code` pins an exact `deepagents` version of its own choosing,
# which will not in general be the floor the `min-deepagents` leg pins. Both
# are legitimate configurations, just not simultaneous ones, so they are
# declared conflicting rather than being reconciled by loosening either.
conflicts = [
    [
        { extra = "deepagents-code" },
        { group = "min-deepagents" },
    ],
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "ANN401",
]
extend-safe-fixes = ["PLR6201"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests: pytest assertions are the point, and docstring rules add noise
# without buying readability for small test helpers.
"tests/**" = [
    "S101",  # use of assert
    "D100", "D101", "D102", "D103", "D104",  # missing docstrings
    "SLF001",  # accessing _private on the class under test
    "PLR2004",  # magic numbers in assertions are fine
    "ANN201", "ANN202",  # missing return annotations on test funcs
    "INP001",  # implicit namespace packages
    "ARG005",  # unused lambda args are common in test stubs
    "EM101", "EM102", "TRY003",  # raise patterns inside stub helpers
    "FBT003",  # bool positional arg in assertions on primitives
    "E501",  # long expectation lines in scripted dialogues
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
